[package]
name = "sec4"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sec4"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
sec4-core = { path = "../sec4-core" }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
socket2 = { version = "0.5", features = ["all"] }
