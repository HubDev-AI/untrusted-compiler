services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sec4_local}
      POSTGRES_USER: ${POSTGRES_USER:-sec4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sec4dev}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
