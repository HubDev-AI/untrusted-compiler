name: Benchmark Smoke

on:
  push:
    branches:
      - main

jobs:
  benchmark-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run benchmark script smoke tests
        run: |
          benchmark-suite/scripts/test_validate_contract_schema.sh
          benchmark-suite/scripts/test_preflight.sh
          benchmark-suite/scripts/test_compare_reports.sh
          benchmark-suite/scripts/test_compare_reports_contract.sh
          benchmark-suite/scripts/test_compare_matrix.sh
          benchmark-suite/scripts/test_compare_matrix_contract.sh
          benchmark-suite/scripts/test_publish_report.sh
          benchmark-suite/scripts/test_check_regression_thresholds.sh
          benchmark-suite/scripts/test_render_trend_note_entry.sh
          benchmark-suite/scripts/test_import_trend_note_entry.sh
          benchmark-suite/scripts/test_fetch_trend_artifact.sh
          benchmark-suite/scripts/test_update_trend_note_from_ci.sh
          benchmark-suite/scripts/test_update_cross_impl_matrix_from_ci.sh
          scripts/test-benchmark-cross-impl-workflow-contract.sh
          scripts/test-benchmark-cross-impl-workflow-contract-guard.sh
          scripts/test-benchmark-trend-workflow-contract.sh
          scripts/test-benchmark-trend-workflow-contract-guard.sh
          scripts/test-refresh-closure-evidence-from-ci.sh
          scripts/test-check-benchmark-evidence-quality.sh
          scripts/test-benchmark-workflow-quality-gates.sh
          scripts/test-benchmark-smoke-closure-gate.sh
          scripts/test-benchmark-smoke-closure-gate-guard.sh
          scripts/test-check-milestone-closure.sh
          scripts/check-milestone-closure.sh --fail-on-pending
          benchmark-suite/scripts/test_run_comparison_matrix.sh
          benchmark-suite/scripts/test_run_step_matrix.sh
          benchmark-suite/scripts/test_run_full_benchmark_suite.sh
          benchmark-suite/scripts/test_run_workbench_full_benchmark_suite.sh
          benchmark-suite/scripts/test_run_workbench_full_benchmark_suite_repeats.sh
          benchmark-suite/scripts/test_run_workbench_benchmark_matrix_local.sh
          benchmark-suite/scripts/test_run_workbench_step_matrix_local.sh
          benchmark-suite/scripts/test_run_workbench_full_benchmark_suite_local.sh
          benchmark-suite/scripts/test_run_workbench_full_benchmark_suite_local_repeats.sh
          benchmark-suite/scripts/test_run_workbench_full_benchmark_suite_local_bundle.sh
          benchmark-suite/scripts/test_render_workbench_full_benchmark_suite_repeats_summary.sh
          benchmark-suite/scripts/test_makefile_profile_targets.sh
