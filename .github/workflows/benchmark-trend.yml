name: Benchmark Trend (Scoped Live)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

jobs:
  scoped-live-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrk2
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev
          git clone --depth 1 https://github.com/giltene/wrk2.git /tmp/wrk2
          make -C /tmp/wrk2
          sudo install -m 0755 /tmp/wrk2/wrk /usr/local/bin/wrk2

      - name: Run scoped live benchmark (node+ping+decode)
        run: |
          benchmark-suite/scripts/run_full_benchmark_suite.sh --impls node --endpoints ping,decode

      - name: Enforce benchmark evidence quality
        run: |
          scripts/check-benchmark-evidence-quality.sh \
            --matrix benchmark-suite/results/summaries/compare-matrix.json \
            --fail-on-warning

      - name: Check regression thresholds (ping)
        run: |
          benchmark-suite/scripts/check_regression_thresholds.sh \
            benchmark-suite/results/summaries/compare-matrix.json \
            --endpoint ping \
            --max-p99-ms 30 \
            --min-target-coverage 85 \
            --max-rss-kb 500000 \
            --baseline benchmark-suite/baselines/node-ping-trend-baseline.json

      - name: Check regression thresholds (decode)
        run: |
          benchmark-suite/scripts/check_regression_thresholds.sh \
            benchmark-suite/results/summaries/compare-matrix.json \
            --endpoint decode \
            --max-p99-ms 80 \
            --min-target-coverage 60 \
            --max-rss-kb 500000 \
            --baseline benchmark-suite/baselines/node-decode-trend-baseline.json

      - name: Render trend note entry artifact
        run: |
          benchmark-suite/scripts/render_trend_note_entry.sh \
            benchmark-suite/results/summaries/compare-matrix.json \
            --endpoints ping,decode \
            --date "$(date -u +%Y-%m-%d)" \
            --baseline-dir benchmark-suite/baselines \
            --out benchmark-suite/results/summaries/trend-note-entry.md

      - name: Upload benchmark trend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-trend-node-ping-decode
          path: benchmark-suite/results
          retention-days: 30
