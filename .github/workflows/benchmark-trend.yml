name: Benchmark Trend (Scoped Live)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

jobs:
  scoped-live-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrk2
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev
          git clone --depth 1 https://github.com/giltene/wrk2.git /tmp/wrk2
          make -C /tmp/wrk2
          sudo install -m 0755 /tmp/wrk2/wrk /usr/local/bin/wrk2

      - name: Run scoped live benchmark (node+ping)
        run: |
          benchmark-suite/scripts/run_full_benchmark_suite.sh --impls node --endpoints ping

      - name: Check regression thresholds
        run: |
          benchmark-suite/scripts/check_regression_thresholds.sh \
            benchmark-suite/results/summaries/compare-matrix.json \
            --endpoint ping \
            --max-p99-ms 30 \
            --min-target-coverage 85 \
            --baseline benchmark-suite/baselines/node-ping-trend-baseline.json

      - name: Upload benchmark trend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-trend-node-ping
          path: benchmark-suite/results
          retention-days: 30
